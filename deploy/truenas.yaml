# MarkStile as a TrueNAS custom app (Apps → Discover Apps → ⋮ → Install via YAML).
# Before pasting:
#   - replace /mnt/POOL/apps/markstile with the dataset you created for it;
#   - to pin a version instead of following latest, use a dated tag from the
#     package page (they look like 2026.11.05.42).
# TrueNAS drops these comments when it saves the app.
name: markstile
services:
  markstile:
    image: ghcr.io/heyjoeway/markstile:latest
    platform: linux/amd64
    restart: unless-stopped
    ports:
      # LAN only. Do not forward this port to the internet.
      - "34871:34871"
    shm_size: 1gb
    # let the browsers flush their bookmark files on shutdown
    stop_grace_period: 30s
    volumes:
      - /mnt/POOL/apps/markstile:/data
    environment:
      TZ: Etc/UTC
