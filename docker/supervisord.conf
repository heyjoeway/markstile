[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
; the orchestrator (user markstile) starts and stops the chosen browsers
file=/run/supervisor.sock
chmod=0700
chown=markstile:markstile

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:xvnc]
; X display :1 and VNC on 127.0.0.1:5901 only, password regenerated at each start
command=/usr/bin/Xvnc :1 -geometry 1600x900 -depth 24 -interface 127.0.0.1 -localhost -rfbport 5901 -SecurityTypes VncAuth -rfbauth /run/markstile/vncpasswd -AlwaysShared -desktop MarkStile
user=markstile
environment=HOME="/data/home"
priority=10
autorestart=true
startretries=1000
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/opt/markstile/bin/launch openbox
user=markstile
priority=20
autorestart=true
startretries=1000
stdout_logfile=/dev/null
redirect_stderr=true

[program:tint2]
command=/opt/markstile/bin/launch tint2
user=markstile
priority=25
autorestart=true
startretries=1000
stdout_logfile=/dev/null
redirect_stderr=true

[program:orchestrator]
command=/opt/markstile/venv/bin/markstile run
user=markstile
environment=HOME="/data/home"
priority=30
autorestart=true
startretries=1000
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
; started by the orchestrator when chosen in the portal
command=/opt/markstile/bin/launch chrome
user=markstile
autostart=false
priority=40
autorestart=true
startretries=1000
startsecs=5
stopwaitsecs=20
; the whole group: Brave's launcher script runs the browser as a child
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/null
redirect_stderr=true

