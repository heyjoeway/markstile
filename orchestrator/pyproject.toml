[project]
name = "markstile"
version = "0.1.0"
description = "Two-way bookmark sync across Chrome, Edge, Brave, Vivaldi, Opera and Firefox using real browsers as adapters"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "argon2-cffi>=23.1",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6.100", "httpx>=0.27"]

[project.scripts]
markstile = "markstile.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["markstile*"]

[tool.setuptools.package-data]
markstile = ["portal/templates/*.html", "portal/static/*", "portal/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "tests"]
